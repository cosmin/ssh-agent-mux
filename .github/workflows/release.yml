name: Release

# Runs in two modes:
# - Dry run (push to main, pull requests, manual dispatch): runs the full release pipeline
#   (changelog, every target's build + packaging, smoke tests) without publishing anything.
#   A green dry run on main is the precondition for tagging a release.
# - Release (push of a v*.*.* tag): same pipeline, then publishes the GitHub release and
#   updates the Homebrew tap. Refuses to run if the tag doesn't match Cargo.toml or if a
#   release for the tag already exists. Tags are never moved; fix forward with a new version.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)
          # Strict semver check: the value flows into later steps and artifact names, and on
          # pull requests Cargo.toml is contributor-controlled.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not read a valid semver version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version (release: $IS_RELEASE)"

      - name: Check tag matches Cargo.toml version
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION"
            exit 1
          fi

      - name: Check release does not already exist
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Releases are immutable; bump the version and tag again."
            exit 1
          fi

  changelog:
    name: Generate changelog
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.build }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    env:
      # For some builds, we use cross to test on 32-bit and big-endian
      # systems.
      CARGO: cargo
      # When CARGO is set to CROSS, this is set to `--target matrix.target`.
      TARGET_FLAGS: ""
      # When CARGO is set to CROSS, TARGET_DIR includes matrix.target.
      TARGET_DIR: ./target
      # Bump this as appropriate. We pin to a version to make sure CI
      # continues to work as cross releases in the past have broken things
      # in subtle ways.
      CROSS_VERSION: v0.2.5
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - build: linux-amd64
          os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          # Statically linked, so it runs on the x86_64 Ubuntu runner
          smoke_test: true
        - build: linux-arm64
          os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - build: darwin-amd64
          os: macos-latest
          target: x86_64-apple-darwin
        - build: darwin-arm64
          os: macos-latest
          target: aarch64-apple-darwin
          # macos-latest runners are Apple Silicon
          smoke_test: true
        - build: freebsd-amd64
          os: ubuntu-latest
          target: x86_64-unknown-freebsd

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ci/ubuntu-install-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{matrix.TARGET}}

      - name: Use Cross
        if: matrix.os == 'ubuntu-latest' && matrix.target != ''
        shell: bash
        run: |
          # In the past, new releases of 'cross' have broken CI. So for now, we
          # pin it. We also use their pre-compiled binary releases because cross
          # has over 100 dependencies and takes a bit to compile.
          dir="$RUNNER_TEMP/cross-download"
          mkdir "$dir"
          echo "$dir" >> $GITHUB_PATH
          cd "$dir"
          curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
          tar xf cross-x86_64-unknown-linux-musl.tar.gz
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Set target variables
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Show command used for Cargo
        shell: bash
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"
          echo "target dir is: ${{ env.TARGET_DIR }}"

      - name: Build release binary
        shell: bash
        run: |
          ${{ env.CARGO }} build --verbose --release ${{ env.TARGET_FLAGS }}
          bin="target/${{ matrix.target }}/release/ssh-agent-mux"
          echo "BIN=$bin" >> $GITHUB_ENV

      - name: Smoke test release binary
        if: matrix.smoke_test
        shell: bash
        run: |
          version_output=$("$BIN" --version)
          echo "$version_output"
          if [ "$version_output" != "ssh-agent-mux $RELEASE_VERSION" ]; then
            echo "::error::Unexpected --version output: $version_output"
            exit 1
          fi
          # Same check as the Homebrew formula's test block
          sock="$RUNNER_TEMP/smoke.sock"
          "$BIN" --log-level info --config /dev/null --listen "$sock" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          for _ in $(seq 100); do [ -S "$sock" ] && break; sleep 0.1; done
          kill "$pid"; wait "$pid" || true
          cat "$RUNNER_TEMP/smoke.log"
          grep -q "Starting agent" "$RUNNER_TEMP/smoke.log"
          grep -q "Exiting on SIGTERM" "$RUNNER_TEMP/smoke.log"

      - name: Determine archive name
        shell: bash
        run: |
          echo "ARCHIVE=ssh-agent-mux-$RELEASE_VERSION-${{ matrix.build }}" >> $GITHUB_ENV

      - name: Creating directory for archive
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"/
          cp "$BIN" "$ARCHIVE"/
          cp {LICENSE.*,README.md,CHANGELOG.md} "$ARCHIVE"/

      - name: Build archive
        shell: bash
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          shasum -a 256 -c "$ARCHIVE.tar.gz.sha256"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz*
          if-no-files-found: error
          retention-days: 14

  publish-github:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload the binary releases
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/*
          file_glob: true
          # Releases are immutable: never replace an asset that's already published
          overwrite: false
          tag: ${{ github.ref }}
          body: ${{ needs.changelog.outputs.release_body }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  homebrew-releaser:
    name: Release to Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-github]
    runs-on: ubuntu-latest
    steps:
      - name: Run homebrew-releaser
        uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: cosmin
          homebrew_tap: homebrew-tap

          version: ${{ github.ref_name }}

          github_token: ${{ secrets.TAP_TOKEN }}

          install: 'bin.install "ssh-agent-mux"'

          test: |
            test_sock = testpath/"#{name}.sock"
            agent_stdout = shell_output(
              %Q(#{opt_bin/name} --log-level info --config /dev/null --listen "#{test_sock}" &) \
              + %Q( until [ -e "#{test_sock}" ]; do sleep 0.1; done; kill %1; wait %1),
            )
            assert_match "Starting agent", agent_stdout
            assert_match "Exiting on SIGTERM", agent_stdout

          target_linux_amd64: true
          target_linux_arm64: true
          target_darwin_amd64: true
          target_darwin_arm64: true

          update_readme_table: true

          # For testing:
          # skip_commit: true
          # debug: true
