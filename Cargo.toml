[package]
name = "ssh-agent-mux"
description = "Combine keys from multiple SSH agents into a single agent socket"
repository = "https://github.com/cosmin/ssh-agent-mux"
license = "Apache-2.0 OR BSD-3-Clause"
keywords = ["ssh", "ssh-agent", "authentication"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".*"]
version = "0.3.0" # bumped by release.sh
edition = "2021"
rust-version = "1.91.0"

[dependencies]
clap-serde-derive = "1.0.0"
flexi_logger = "0.32.0"
ssh-agent-lib = "0.6.0"
toml = "1.2.2"

[dependencies.shellexpand]
version = "3.1.2"
features = ["path"]

[dependencies.color-eyre]
version = "0.6.5"
default-features = false
features = ["track-caller"]

[dependencies.log]
version = "0.4.35"
features = ["std"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.service-manager]
version = "0.11.0"
default-features = false

[dependencies.tokio]
version = "1.54.1"
features = ["rt", "macros", "signal", "sync"]

[dev-dependencies]
duct = "1.1.2"
tempfile = "3.27.0"
